<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <style>
      .trace { fill: none; stroke: #D4AF37; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.18; }
      .trace-thick { fill: none; stroke: #D4AF37; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; opacity: 0.15; }
      .via { fill: #1c0205; stroke: #D4AF37; stroke-width: 1.5; opacity: 0.22; }
      .via-inner { fill: #000000; opacity: 0.25; }
      .pad { fill: none; stroke: #C0C5CE; stroke-width: 1.2; opacity: 0.16; }
    </style>
  </defs>

  <!-- Ground Plane Stitching Grid (Subtle Dots) -->
  <g fill="#D4AF37" opacity="0.08">
    <circle cx="20" cy="20" r="1.2" /><circle cx="100" cy="20" r="1.2" /><circle cx="180" cy="20" r="1.2" /><circle cx="260" cy="20" r="1.2" /><circle cx="340" cy="20" r="1.2" />
    <circle cx="60" cy="60" r="1.2" /><circle cx="140" cy="60" r="1.2" /><circle cx="220" cy="60" r="1.2" /><circle cx="300" cy="60" r="1.2" /><circle cx="380" cy="60" r="1.2" />
    <circle cx="20" cy="100" r="1.2" /><circle cx="100" cy="100" r="1.2" /><circle cx="180" cy="100" r="1.2" /><circle cx="260" cy="100" r="1.2" /><circle cx="340" cy="100" r="1.2" />
    <circle cx="60" cy="140" r="1.2" /><circle cx="140" cy="140" r="1.2" /><circle cx="220" cy="140" r="1.2" /><circle cx="300" cy="140" r="1.2" /><circle cx="380" cy="140" r="1.2" />
    <circle cx="20" cy="180" r="1.2" /><circle cx="100" cy="180" r="1.2" /><circle cx="180" cy="180" r="1.2" /><circle cx="260" cy="180" r="1.2" /><circle cx="340" cy="180" r="1.2" />
    <circle cx="60" cy="220" r="1.2" /><circle cx="140" cy="220" r="1.2" /><circle cx="220" cy="220" r="1.2" /><circle cx="300" cy="220" r="1.2" /><circle cx="380" cy="220" r="1.2" />
    <circle cx="20" cy="260" r="1.2" /><circle cx="100" cy="260" r="1.2" /><circle cx="180" cy="260" r="1.2" /><circle cx="260" cy="260" r="1.2" /><circle cx="340" cy="260" r="1.2" />
    <circle cx="60" cy="300" r="1.2" /><circle cx="140" cy="300" r="1.2" /><circle cx="220" cy="300" r="1.2" /><circle cx="300" cy="300" r="1.2" /><circle cx="380" cy="300" r="1.2" />
    <circle cx="20" cy="340" r="1.2" /><circle cx="100" cy="340" r="1.2" /><circle cx="180" cy="340" r="1.2" /><circle cx="260" cy="340" r="1.2" /><circle cx="340" cy="340" r="1.2" />
    <circle cx="60" cy="380" r="1.2" /><circle cx="140" cy="380" r="1.2" /><circle cx="220" cy="380" r="1.2" /><circle cx="300" cy="380" r="1.2" /><circle cx="380" cy="380" r="1.2" />
  </g>

  <!-- Bus Traces (45-degree angle routed) -->
  <g class="trace">
    <!-- Seamless wrap 1: top to right -->
    <path d="M 0 80 L 40 80 L 100 20 L 160 20 L 200 60 L 260 60 L 300 20 L 360 20 L 400 60" />
    <path d="M 0 92 L 35 92 L 95 32 L 155 32 L 195 72 L 255 72 L 295 32 L 355 32 L 395 72 L 400 72" />
    <path d="M 0 104 L 30 104 L 90 44 L 150 44 L 190 84 L 250 84 L 290 44 L 350 44 L 390 84 L 400 84" />

    <!-- Center Diagonal Circuit Cluster -->
    <path d="M 60 400 L 60 340 L 120 280 L 120 200 L 160 160 L 240 160 L 280 200 L 280 260 L 340 320 L 340 400" />
    <path d="M 72 400 L 72 345 L 132 285 L 132 205 L 168 169 L 232 169 L 268 205 L 268 255 L 328 315 L 328 400" />

    <!-- Horizontal & 45deg connecting branches -->
    <path d="M 120 200 L 80 200 L 50 230 L 50 300 L 20 330 L 0 330" />
    <path d="M 280 200 L 320 200 L 350 170 L 350 120 L 380 90 L 400 90" />
    <path d="M 200 60 L 200 120 L 220 140 L 220 160" />
    <path d="M 160 20 L 160 0" />
    <path d="M 240 400 L 240 360 L 200 320 L 200 240 L 180 220 L 180 180" />
    <path d="M 400 240 L 360 240 L 320 280 L 260 280 L 220 320 L 140 320 L 100 360 L 0 360" />
  </g>

  <!-- Thick Power & Ground Traces -->
  <g class="trace-thick">
    <path d="M 0 140 L 80 140 L 140 80 L 260 80 L 320 140 L 400 140" />
    <path d="M 0 280 L 60 280 L 100 240 L 160 240 L 200 280 L 300 280 L 340 240 L 400 240" />
  </g>

  <!-- Vias (with drill holes) -->
  <g>
    <!-- Via 1 -->
    <circle cx="80" cy="140" r="5" class="via" />
    <circle cx="80" cy="140" r="2.2" class="via-inner" />
    <!-- Via 2 -->
    <circle cx="320" cy="140" r="5" class="via" />
    <circle cx="320" cy="140" r="2.2" class="via-inner" />
    <!-- Via 3 -->
    <circle cx="160" cy="20" r="5" class="via" />
    <circle cx="160" cy="20" r="2.2" class="via-inner" />
    <!-- Via 4 -->
    <circle cx="200" cy="120" r="5" class="via" />
    <circle cx="200" cy="120" r="2.2" class="via-inner" />
    <!-- Via 5 -->
    <circle cx="50" cy="300" r="5" class="via" />
    <circle cx="50" cy="300" r="2.2" class="via-inner" />
    <!-- Via 6 -->
    <circle cx="350" cy="120" r="5" class="via" />
    <circle cx="350" cy="120" r="2.2" class="via-inner" />
    <!-- Via 7 -->
    <circle cx="200" cy="320" r="5" class="via" />
    <circle cx="200" cy="320" r="2.2" class="via-inner" />
    <!-- Via 8 -->
    <circle cx="100" cy="240" r="5" class="via" />
    <circle cx="100" cy="240" r="2.2" class="via-inner" />
  </g>

  <!-- SMD Test Pads -->
  <g class="pad">
    <rect x="180" y="145" width="10" height="6" rx="1" />
    <rect x="210" y="145" width="10" height="6" rx="1" />
    <rect x="180" y="250" width="10" height="6" rx="1" />
    <rect x="210" y="250" width="10" height="6" rx="1" />
  </g>
</svg>
