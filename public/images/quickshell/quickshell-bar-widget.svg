<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b" />
      <stop offset="50%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bg2)" />
  <rect width="1200" height="630" fill="url(#grid2)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />

  <!-- Top Bar Simulation -->
  <g transform="translate(60, 70)">
    <rect width="1080" height="56" rx="10" fill="#141820" stroke="#00ffcc" stroke-width="1.5" stroke-opacity="0.5" />
    <!-- Left Workspace numbers -->
    <g transform="translate(20, 14)">
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#00ffcc" />
      <text x="14" y="19" fill="#08090b" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">1</text>
      <rect x="36" y="0" width="28" height="28" rx="6" fill="#1e293b" />
      <text x="50" y="19" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">2</text>
      <rect x="72" y="0" width="28" height="28" rx="6" fill="#1e293b" />
      <text x="86" y="19" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">3</text>
    </g>
    <!-- Center active window title -->
    <text x="540" y="33" fill="#e4e4e7" font-family="sans-serif" font-size="14" font-weight="500" text-anchor="middle">alacritty — [ozdil@omarchy:~] — nvim Bar.qml</text>
    <!-- Right stats widgets -->
    <g transform="translate(860, 14)">
      <rect x="0" y="0" width="60" height="28" rx="6" fill="#101318" stroke="#27272a" stroke-width="1" />
      <text x="30" y="18" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">RAM 21%</text>
      <rect x="68" y="0" width="60" height="28" rx="6" fill="#101318" stroke="#27272a" stroke-width="1" />
      <text x="98" y="18" fill="#eab308" font-family="monospace" font-size="11" text-anchor="middle">BAT 98%</text>
      <rect x="136" y="0" width="70" height="28" rx="6" fill="#101318" stroke="#27272a" stroke-width="1" />
      <text x="171" y="18" fill="#00ffcc" font-family="monospace" font-size="11" text-anchor="middle">14:45:02</text>
    </g>
  </g>

  <!-- Main Code and Visual Widget -->
  <g transform="translate(60, 160)">
    <!-- Code Editor Window -->
    <rect width="660" height="380" rx="12" fill="#101318" stroke="#27272a" stroke-width="1" />
    <rect width="660" height="40" rx="12" fill="#141820" />
    <text x="30" y="25" fill="#71717a" font-family="monospace" font-size="13">src/shell/widgets/StatusIndicator.qml</text>
    
    <g transform="translate(30, 60)" font-family="monospace" font-size="13" line-height="24">
      <text y="20" fill="#c084fc">import QtQuick 2.15</text>
      <text y="45" fill="#c084fc">import Quickshell 1.0</text>
      <text y="70" fill="#c084fc">import Quickshell.Services.SystemTray 1.0</text>
      <text y="105" fill="#38bdf8">Rectangle {</text>
      <text y="130" fill="#a1a1aa">    id: <tspan fill="#e4e4e7">root</tspan></text>
      <text y="155" fill="#a1a1aa">    color: <tspan fill="#00ffcc">"#08090b"</tspan></text>
      <text y="180" fill="#a1a1aa">    radius: <tspan fill="#f59e0b">8</tspan></text>
      <text y="205" fill="#a1a1aa">    border.color: <tspan fill="#00ffcc">"#00ffcc"</tspan></text>
      <text y="230" fill="#a1a1aa">    border.width: <tspan fill="#f59e0b">1</tspan></text>
      <text y="260" fill="#64748b">    // Smooth hover animation &amp; QML bindings</text>
      <text y="285" fill="#38bdf8">    Behavior on opacity { NumberAnimation { duration: 150 } }</text>
      <text y="310" fill="#38bdf8">}</text>
    </g>

    <!-- Side Highlight Preview -->
    <g transform="translate(690, 0)">
      <rect width="390" height="380" rx="12" fill="#101318" stroke="#00ffcc" stroke-width="1" stroke-opacity="0.3" />
      <text x="30" y="50" fill="#00ffcc" font-family="monospace" font-size="18" font-weight="bold">// MODULAR WIDGETS</text>
      <text x="30" y="80" fill="#a1a1aa" font-family="sans-serif" font-size="14">Wayland LayerShell &amp; QML Components</text>
      
      <!-- Component Card 1 -->
      <rect x="30" y="110" width="330" height="65" rx="8" fill="#141820" stroke="#27272a" stroke-width="1" />
      <text x="50" y="138" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Workspace Switcher</text>
      <text x="50" y="158" fill="#71717a" font-family="sans-serif" font-size="12">Hyprland socket2 real-time dispatch</text>

      <!-- Component Card 2 -->
      <rect x="30" y="190" width="330" height="65" rx="8" fill="#141820" stroke="#27272a" stroke-width="1" />
      <text x="50" y="218" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Media &amp; Volume OSD</text>
      <text x="50" y="238" fill="#71717a" font-family="sans-serif" font-size="12">MPRIS2 integration &amp; WirePlumber hook</text>

      <!-- Component Card 3 -->
      <rect x="30" y="270" width="330" height="75" rx="8" fill="#141820" stroke="#27272a" stroke-width="1" />
      <text x="50" y="298" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">Custom Sensor Monitor</text>
      <text x="50" y="322" fill="#71717a" font-family="sans-serif" font-size="12">Direct sysfs reads for CPU/GPU telemetry</text>
    </g>
  </g>
</svg>
