<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgLock)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />

  <g transform="translate(80, 80)">
    <text x="0" y="30" fill="#f43f5e" font-family="monospace" font-size="16" font-weight="bold">// SECURITY &amp; NOTIFICATIONS</text>
    <text x="0" y="75" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="bold">Quickshell Kilit Ekranı &amp; Bildirim Merkezi</text>
    <text x="0" y="110" fill="#94a3b8" font-family="sans-serif" font-size="16">PAM kimlik doğrulama, Wayland input inhibitörleri ve akıcı açılış efektleri</text>

    <!-- Visual Lock Screen Mockup -->
    <g transform="translate(180, 160)">
      <rect width="680" height="300" rx="16" fill="#101318" stroke="#27272a" stroke-width="1.5" />
      
      <!-- Big Clock -->
      <text x="340" y="90" fill="#ffffff" font-family="sans-serif" font-size="52" font-weight="bold" text-anchor="middle">16:20</text>
      <text x="340" y="125" fill="#94a3b8" font-family="monospace" font-size="14" text-anchor="middle">Çarşamba, 10 Eylül 2026</text>
      
      <!-- User Avatar / Name -->
      <circle cx="340" cy="180" r="28" fill="#1e293b" stroke="#00ffcc" stroke-width="2" />
      <text x="340" y="186" fill="#00ffcc" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">OÖ</text>
      
      <!-- Password field mockup -->
      <rect x="240" y="230" width="200" height="36" rx="8" fill="#08090b" stroke="#38bdf8" stroke-width="1" />
      <text x="340" y="253" fill="#38bdf8" font-family="monospace" font-size="14" text-anchor="middle">••••••••••</text>
    </g>
  </g>
</svg>
