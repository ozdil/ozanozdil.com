<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
  
  <g transform="translate(100, 100)">
    <text x="0" y="40" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">// EVENT PIPELINE</text>
    <text x="0" y="90" fill="#ffffff" font-family="sans-serif" font-size="36" font-weight="bold">Quickshell IPC &amp; D-Bus Architecture</text>
    <text x="0" y="130" fill="#94a3b8" font-family="sans-serif" font-size="18">Hyprland socket2 listeners, WirePlumber signals &amp; zero-latency notifications</text>

    <!-- Interactive flow diagram -->
    <g transform="translate(0, 180)">
      <!-- Box 1 -->
      <rect x="0" y="0" width="280" height="180" rx="12" fill="#141820" stroke="#38bdf8" stroke-width="1.5" />
      <text x="30" y="45" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">Hyprland IPC</text>
      <text x="30" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="13">/tmp/hypr/$HIS/.socket2.sock</text>
      <text x="30" y="105" fill="#64748b" font-family="monospace" font-size="12">• workspace&gt;&gt;id</text>
      <text x="30" y="130" fill="#64748b" font-family="monospace" font-size="12">• activewindow&gt;&gt;title</text>
      <text x="30" y="155" fill="#64748b" font-family="monospace" font-size="12">• fullscreen&gt;&gt;bool</text>

      <!-- Arrow 1 -->
      <path d="M 290 90 L 350 90" stroke="#00ffcc" stroke-width="2" marker-end="url(#arrow)" />

      <!-- Box 2: Quickshell Core -->
      <rect x="360" y="0" width="280" height="180" rx="12" fill="#101318" stroke="#00ffcc" stroke-width="2" />
      <text x="390" y="45" fill="#00ffcc" font-family="monospace" font-size="16" font-weight="bold">Quickshell Core</text>
      <text x="390" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="13">Event Dispatch Engine</text>
      <text x="390" y="110" fill="#38bdf8" font-family="monospace" font-size="12">QML Property Binding</text>
      <text x="390" y="135" fill="#a1a1aa" font-family="monospace" font-size="12">Qt Scenegraph Refresh</text>
      <text x="390" y="160" fill="#22c55e" font-family="monospace" font-size="12">Latency &lt; 0.4ms</text>

      <!-- Arrow 2 -->
      <path d="M 650 90 L 710 90" stroke="#00ffcc" stroke-width="2" />

      <!-- Box 3: Wayland Surface -->
      <rect x="720" y="0" width="280" height="180" rx="12" fill="#141820" stroke="#c084fc" stroke-width="1.5" />
      <text x="750" y="45" fill="#c084fc" font-family="monospace" font-size="16" font-weight="bold">Wayland Layer</text>
      <text x="750" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="13">zwlr_layer_surface_v1</text>
      <text x="750" y="110" fill="#64748b" font-family="monospace" font-size="12">• Top Bar Panel</text>
      <text x="750" y="135" fill="#64748b" font-family="monospace" font-size="12">• Volume OSD</text>
      <text x="750" y="160" fill="#64748b" font-family="monospace" font-size="12">• Lock Screen Frame</text>
    </g>
  </g>
</svg>
