<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgPlug" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgPlug)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />

  <g transform="translate(80, 80)">
    <text x="0" y="30" fill="#22c55e" font-family="monospace" font-size="16" font-weight="bold">// EXTENSIBILITY</text>
    <text x="0" y="75" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="bold">Quickshell Eklenti Ekosistemi &amp; Modüler Yapı</text>
    <text x="0" y="110" fill="#94a3b8" font-family="sans-serif" font-size="16">plugins.omarchy.org topluluk eklentileri, QML manifest standartları ve dinamik yükleme</text>

    <!-- Plugin Grid -->
    <g transform="translate(0, 160)">
      <g transform="translate(0, 0)">
        <rect width="320" height="120" rx="10" fill="#141820" stroke="#22c55e" stroke-width="1" />
        <circle cx="35" cy="40" r="14" fill="#22c55e" fill-opacity="0.2" />
        <text x="35" y="45" fill="#22c55e" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">⚡</text>
        <text x="65" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">BadUSB Shield Plugin</text>
        <text x="25" y="80" fill="#94a3b8" font-family="sans-serif" font-size="12">USB veri yollarını anlık izleyen donanım nöbetçisi.</text>
        <text x="25" y="102" fill="#22c55e" font-family="monospace" font-size="11">plugins.omarchy.org/badusb</text>
      </g>

      <g transform="translate(360, 0)">
        <rect width="320" height="120" rx="10" fill="#141820" stroke="#38bdf8" stroke-width="1" />
        <circle cx="35" cy="40" r="14" fill="#38bdf8" fill-opacity="0.2" />
        <text x="35" y="45" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">🛡️</text>
        <text x="65" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">CVE Radar Plugin</text>
        <text x="25" y="80" fill="#94a3b8" font-family="sans-serif" font-size="12">1.100+ paket için anlık zafiyet tarama aracı.</text>
        <text x="25" y="102" fill="#38bdf8" font-family="monospace" font-size="11">plugins.omarchy.org/cve-radar</text>
      </g>

      <g transform="translate(720, 0)">
        <rect width="320" height="120" rx="10" fill="#141820" stroke="#f59e0b" stroke-width="1" />
        <circle cx="35" cy="40" r="14" fill="#f59e0b" fill-opacity="0.2" />
        <text x="35" y="45" fill="#f59e0b" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">🌐</text>
        <text x="65" y="42" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">DNS Leak Guard</text>
        <text x="25" y="80" fill="#94a3b8" font-family="sans-serif" font-size="12">DoT / DoH şifreleme tüneli sürekli doğrulama.</text>
        <text x="25" y="102" fill="#f59e0b" font-family="monospace" font-size="11">plugins.omarchy.org/dns-guard</text>
      </g>

      <!-- Plugin Architecture Box -->
      <g transform="translate(0, 150)">
        <rect width="1040" height="120" rx="10" fill="#0e131b" stroke="#27272a" stroke-width="1" />
        <text x="30" y="40" fill="#00ffcc" font-family="monospace" font-size="15" font-weight="bold">// QUICKSHELL PLUGIN MANIFEST SCHEMA</text>
        <text x="30" y="75" fill="#e4e4e7" font-family="monospace" font-size="13">~/.config/quickshell/plugins/&lt;name&gt;/metadata.json  ➔  EntryPoint.qml (Component: PanelItem)</text>
        <text x="30" y="100" fill="#64748b" font-family="sans-serif" font-size="12">Hot-reload desteği ile eklentiyi kaydettiğiniz anda yeniden derlemeye gerek kalmadan canlı yenilenir.</text>
      </g>
    </g>
  </g>
</svg>
