<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgPerf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090b" />
      <stop offset="50%" stop-color="#141820" />
      <stop offset="100%" stop-color="#08090b" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgPerf)" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />

  <g transform="translate(80, 80)">
    <text x="0" y="30" fill="#00ffcc" font-family="monospace" font-size="16" font-weight="bold">// BENCHMARKS &amp; TELEMETRY</text>
    <text x="0" y="75" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="bold">Quickshell Performans Mimarisi: 0ms &amp; &lt;35MB</text>
    <text x="0" y="110" fill="#94a3b8" font-family="sans-serif" font-size="16">C++ çekirdeği ve Qt Quick donanım hızlandırmalı sahne grafiği ile minimal kaynak tüketimi</text>

    <!-- Benchmark Bar Chart Comparison -->
    <g transform="translate(0, 160)">
      <!-- Item 1: Quickshell -->
      <g transform="translate(0, 0)">
        <text x="0" y="22" fill="#00ffcc" font-family="monospace" font-size="14" font-weight="bold">Quickshell (Qt/C++)</text>
        <rect x="220" y="5" width="120" height="26" rx="6" fill="#00ffcc" />
        <text x="355" y="23" fill="#00ffcc" font-family="monospace" font-size="13" font-weight="bold">32 MB RAM / 0.1% CPU</text>
      </g>

      <!-- Item 2: AGS (Aylur's GTK Shell) -->
      <g transform="translate(0, 55)">
        <text x="0" y="22" fill="#cbd5e1" font-family="monospace" font-size="14">AGS (GJS / GTK4)</text>
        <rect x="220" y="5" width="340" height="26" rx="6" fill="#475569" />
        <text x="575" y="23" fill="#94a3b8" font-family="monospace" font-size="13">140 MB RAM / 0.8% CPU</text>
      </g>

      <!-- Item 3: Waybar (GTK3) -->
      <g transform="translate(0, 110)">
        <text x="0" y="22" fill="#cbd5e1" font-family="monospace" font-size="14">Waybar (C++ / GTK3)</text>
        <rect x="220" y="5" width="220" height="26" rx="6" fill="#334155" />
        <text x="455" y="23" fill="#94a3b8" font-family="monospace" font-size="13">65 MB RAM / 0.4% CPU</text>
      </g>

      <!-- Item 4: Electron Shells -->
      <g transform="translate(0, 165)">
        <text x="0" y="22" fill="#ef4444" font-family="monospace" font-size="14">Electron / Webview</text>
        <rect x="220" y="5" width="700" height="26" rx="6" fill="#ef4444" fill-opacity="0.8" />
        <text x="935" y="23" fill="#ef4444" font-family="monospace" font-size="13">450+ MB RAM</text>
      </g>
      
      <!-- Summary Box -->
      <g transform="translate(0, 220)">
        <rect width="1040" height="60" rx="8" fill="#101318" stroke="#27272a" stroke-width="1" />
        <text x="25" y="36" fill="#38bdf8" font-family="monospace" font-size="12">Render Frame Budget: 16.6ms @ 60fps | 6.9ms @ 144fps — Quickshell average draw time: 0.18ms</text>
      </g>
    </g>
  </g>
</svg>
