<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#000000" />
  <rect x="24" y="24" width="1152" height="582" rx="16" fill="none" stroke="#222222" stroke-width="1" />
  
  <g transform="translate(80, 80)">
    <text x="0" y="30" fill="#00ffcc" font-family="monospace" font-size="16" font-weight="bold">// COLOR ENGINE</text>
    <text x="0" y="75" fill="#ffffff" font-family="sans-serif" font-size="34" font-weight="bold">Quickshell Dinamik OLED Tema Motoru</text>
    <text x="0" y="110" fill="#888888" font-family="sans-serif" font-size="16">Gerçek #000000 siyahlar, Catppuccin, Tokyo Night ve anında tema değişimi</text>

    <!-- Palette Cards -->
    <g transform="translate(0, 160)">
      <!-- Türkiye Theme Card -->
      <g transform="translate(0, 0)">
        <rect width="230" height="280" rx="12" fill="#0a0a0a" stroke="#e11d48" stroke-width="1.5" />
        <rect x="20" y="20" width="190" height="90" rx="8" fill="#e11d48" fill-opacity="0.2" />
        <circle cx="115" cy="65" r="24" fill="#e11d48" />
        <text x="115" y="145" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Türkiye Teması</text>
        <text x="115" y="170" fill="#888888" font-family="monospace" font-size="12" text-anchor="middle">OLED Kırmızı / Turkuaz</text>
        <rect x="35" y="210" width="160" height="30" rx="6" fill="#18181b" />
        <text x="115" y="230" fill="#00ffcc" font-family="monospace" font-size="11" text-anchor="middle">#e11d48 • #00ffcc</text>
      </g>

      <!-- Steam Machine Card -->
      <g transform="translate(260, 0)">
        <rect width="230" height="280" rx="12" fill="#0a0a0a" stroke="#f97316" stroke-width="1.5" />
        <rect x="20" y="20" width="190" height="90" rx="8" fill="#f97316" fill-opacity="0.2" />
        <circle cx="115" cy="65" r="24" fill="#f97316" />
        <text x="115" y="145" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Steam Machine</text>
        <text x="115" y="170" fill="#888888" font-family="monospace" font-size="12" text-anchor="middle">Valve Lambda Orange</text>
        <rect x="35" y="210" width="160" height="30" rx="6" fill="#18181b" />
        <text x="115" y="230" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">#f97316 • #38bdf8</text>
      </g>

      <!-- Ankara Card -->
      <g transform="translate(520, 0)">
        <rect width="230" height="280" rx="12" fill="#0a0a0a" stroke="#f59e0b" stroke-width="1.5" />
        <rect x="20" y="20" width="190" height="90" rx="8" fill="#f59e0b" fill-opacity="0.2" />
        <circle cx="115" cy="65" r="24" fill="#f59e0b" />
        <text x="115" y="145" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Ankara Teması</text>
        <text x="115" y="170" fill="#888888" font-family="monospace" font-size="12" text-anchor="middle">Sıcak Kehribar / Lacivert</text>
        <rect x="35" y="210" width="160" height="30" rx="6" fill="#18181b" />
        <text x="115" y="230" fill="#f59e0b" font-family="monospace" font-size="11" text-anchor="middle">#f59e0b • #1e3a8a</text>
      </g>

      <!-- Istanbul Card -->
      <g transform="translate(780, 0)">
        <rect width="230" height="280" rx="12" fill="#0a0a0a" stroke="#00ffcc" stroke-width="1.5" />
        <rect x="20" y="20" width="190" height="90" rx="8" fill="#00ffcc" fill-opacity="0.2" />
        <circle cx="115" cy="65" r="24" fill="#00ffcc" />
        <text x="115" y="145" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">İstanbul Teması</text>
        <text x="115" y="170" fill="#888888" font-family="monospace" font-size="12" text-anchor="middle">İznik Turkuazı / Mercan</text>
        <rect x="35" y="210" width="160" height="30" rx="6" fill="#18181b" />
        <text x="115" y="230" fill="#fb7185" font-family="monospace" font-size="11" text-anchor="middle">#00ffcc • #fb7185</text>
      </g>
    </g>
  </g>
</svg>
